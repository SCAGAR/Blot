/* Blot: blue-black ink on cool writing paper. Chrome stays quiet; the ink blot is the one flourish. */
:root {
  --serif: 'Literata', Georgia, 'Noto Serif', serif;
  --sans: 'Hanken Grotesk', system-ui, 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, 'Cascadia Mono', 'Roboto Mono', Consolas, monospace;
  --r: 7px;
  --ed-font: var(--serif); --ed-size: 19px; --ed-lh: 1.75; --ed-width: 680px;
}
:root, [data-theme=paper] {
  --bg: #eceff4; --paper: #fbfcfe; --side: #e4e8ef; --ink: #18223b; --mut: #56617b; --faint: #8791a8; --line: #d2d8e2;
  --acc: #2450c8; --acc-ink: #fff; --acc-soft: #d9e3fa; --hl: #ffe27a; --note: #f1b4c2; --note-ink: #5c1c2c;
  --err: #c2362b; --ok: #1c8556; --warn: #a4570b; --c1: #2f62d8; --c2: #b8620f;
  --shadow: 0 12px 44px rgba(24, 34, 59, .2); --field: rgba(24, 34, 59, .055);
  color-scheme: light;
}
[data-theme=sepia] {
  --bg: #e7dcc3; --paper: #f4ebd7; --side: #dfd3b8; --ink: #382c1d; --mut: #6a5a44; --faint: #93826a; --line: #cfc0a0;
  --acc: #8a4812; --acc-ink: #fff; --acc-soft: #e6d2ad; --hl: #f3d055; --note: #e3a79c; --note-ink: #4f1d14;
  --err: #a8321f; --ok: #3d7a3b; --warn: #8a4c06; --c1: #2f62d8; --c2: #b8620f;
  --shadow: 0 12px 44px rgba(56, 44, 29, .25); --field: rgba(56, 44, 29, .07);
  color-scheme: light;
}
[data-theme=ink] {
  --bg: #0a101c; --paper: #0f1727; --side: #090e18; --ink: #d5dbea; --mut: #8d98b4; --faint: #5f6a86; --line: #1e2940;
  --acc: #8fa9ff; --acc-ink: #0a1020; --acc-soft: #1a2849; --hl: rgba(255, 213, 64, .3); --note: #a24a60; --note-ink: #ffe6ec;
  --err: #ff8478; --ok: #5fd0a0; --warn: #f0b060; --c1: #6585ee; --c2: #c4812f;
  --shadow: 0 12px 44px rgba(0, 0, 0, .6); --field: rgba(213, 219, 234, .07);
  color-scheme: dark;
}
[data-theme=black] {
  --bg: #000; --paper: #000; --side: #04060b; --ink: #c4cada; --mut: #7e88a2; --faint: #505a73; --line: #151b29;
  --acc: #8fa9ff; --acc-ink: #0a1020; --acc-soft: #131d36; --hl: rgba(255, 213, 64, .28); --note: #8e3f53; --note-ink: #ffe6ec;
  --err: #ff8478; --ok: #5fd0a0; --warn: #f0b060; --c1: #6585ee; --c2: #c4812f;
  --shadow: 0 0 0 1px #232b3f; --field: rgba(196, 202, 218, .08);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.45 var(--sans); color: var(--ink); background: var(--bg); overflow: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
::selection { background: color-mix(in srgb, var(--acc) 30%, transparent); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
h1, h2, h3, h4, p { margin: 0; }
p + p, h3 + p { margin-top: .6em; }
h2 { font: 600 20px/1.25 var(--serif); }
h3 { font: 650 14px/1.3 var(--sans); margin: 1.5em 0 .5em; }
h4 { font: 650 12.5px/1.3 var(--sans); color: var(--mut); margin: 1em 0 .3em; }
hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
code { font: 12.5px var(--mono); background: var(--field); padding: 1px 5px; border-radius: 4px; }
.muted { color: var(--mut); } .small { font-size: 12.5px; } .spacer { flex: 1; }
.warn { color: var(--warn); }
.ico { flex: none; }
.blot { fill: currentColor; flex: none; }
.boot { height: 100dvh; display: grid; place-items: center; color: var(--acc); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; min-height: 32px; border: 1px solid transparent; border-radius: var(--r); background: var(--field); cursor: pointer; white-space: nowrap; }
.btn:hover { background: color-mix(in srgb, var(--ink) 11%, transparent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-ico { padding: 6px; min-width: 32px; justify-content: center; background: transparent; color: var(--mut); }
.btn-ico:hover, .btn-ico.on { color: var(--ink); }
.btn.on { background: var(--acc-soft); color: var(--ink); }
.btn.primary { background: var(--acc); color: var(--acc-ink); font-weight: 600; }
.btn.primary:hover { background: color-mix(in srgb, var(--acc) 86%, var(--ink)); }
.btn.danger { color: var(--err); }
.btn.primary.danger { background: var(--err); color: #fff; }
.btn.link { background: none; padding: 2px 4px; min-height: 0; color: var(--acc); }
.btn.link:hover { text-decoration: underline; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; background: var(--field); border-radius: var(--r); padding: 2px; gap: 2px; }
.seg button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 10px; min-height: 28px; border-radius: 5px; cursor: pointer; color: var(--mut); white-space: nowrap; font-variant-numeric: tabular-nums; }
.seg button.on { background: var(--paper); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.field { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--field); min-height: 34px; }
textarea.field { resize: vertical; line-height: 1.5; display: block; }
.field:focus { outline: 2px solid var(--acc); outline-offset: -1px; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld-l { font-size: 12.5px; font-weight: 600; color: var(--mut); }
.fld-h { font-size: 12px; color: var(--mut); }
.chk { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }
.chk input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--acc); flex: none; }
.chk small { display: block; color: var(--mut); font-size: 12.5px; }
.chk.tight { align-items: center; font-size: 12.5px; color: var(--mut); }
.chk.tight input { margin: 0; }
.form { display: flex; flex-direction: column; gap: 14px; }
.form.pad { padding-top: 18px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 12px; }
.suffix { display: flex; align-items: center; gap: 8px; color: var(--mut); }
.tag { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; color: var(--mut); min-height: 28px; }
.tag.on { background: var(--acc-soft); border-color: transparent; color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.bar { display: inline-block; width: 46px; height: 4px; border-radius: 2px; background: var(--line); margin-left: 8px; vertical-align: middle; position: relative; overflow: hidden; }
.bar::after { content: ''; position: absolute; inset: 0; background: var(--acc); transform-origin: left; transform: scaleX(var(--v, 0)); }
.bar.big { width: 100%; height: 8px; border-radius: 4px; margin: 0; display: block; }
.stamp { display: inline-block; border: 1.5px solid currentColor; border-radius: 3px; padding: 0 6px; font-size: 11px; font-weight: 700; line-height: 17px; transform: rotate(-3deg); white-space: nowrap; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: var(--bw, 284px) minmax(0, 1fr) var(--iw, 316px); height: 100dvh; }
.app.no-binder { --bw: 0px; } .app.no-insp { --iw: 0px; }
.app.focus { --bw: 0px; --iw: 0px; }
.binder, .insp { background: var(--side); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.binder { border-right: 1px solid var(--line); } .insp { border-left: 1px solid var(--line); }
.app.no-binder .binder, .app.no-insp .insp, .app.focus .binder, .app.focus .insp { visibility: hidden; border: 0; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--paper); position: relative; }
.scrim { display: none; }
.stage { flex: 1; display: flex; min-height: 0; min-width: 0; }

/* ---------- binder ---------- */
.b-head { padding: 10px 10px 6px; }
.proj { display: flex; align-items: center; gap: 9px; width: 100%; border: 0; background: none; padding: 6px 6px; border-radius: var(--r); cursor: pointer; font: 600 17px/1.2 var(--serif); text-align: left; }
.proj:hover { background: var(--field); }
.proj span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .blot { color: var(--acc); }
.b-tools { display: flex; justify-content: space-between; padding: 6px 2px 0; }
.tree { flex: 1; overflow-y: auto; padding: 2px 0 20px; overscroll-behavior: contain; }
.row { display: flex; align-items: center; gap: 6px; height: 34px; margin: 0 6px; padding: 0 6px 0 calc(4px + var(--d) * 15px); border-radius: 6px; position: relative; cursor: default; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
.row:hover { background: var(--field); }
.row.sel { background: var(--acc-soft); }
.row.root { margin-top: 12px; font-weight: 650; color: var(--mut); }
.row.root:first-child { margin-top: 0; }
.tw { width: 20px; height: 26px; flex: none; display: grid; place-items: center; border: 0; background: none; padding: 0; color: var(--faint); cursor: pointer; border-radius: 4px; }
.r-ico { color: var(--faint); display: grid; }
.r-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-edit { flex: 1; min-width: 0; border: 1px solid var(--acc); border-radius: 4px; background: var(--paper); padding: 2px 6px; }
.r-wc { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.r-stat { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.r-prog { width: 13px; height: 13px; border-radius: 50%; flex: none; background: conic-gradient(var(--acc) calc(var(--v) * 360deg), var(--line) 0); }
.r-prog.full { background: var(--ok); }
.r-more { border: 0; background: none; padding: 2px; display: grid; color: var(--mut); cursor: pointer; border-radius: 4px; }
.drop-before::before, .drop-after::after { content: ''; position: absolute; left: calc(4px + var(--d, 0) * 15px); right: 2px; height: 2px; border-radius: 1px; background: var(--acc); pointer-events: none; }
.drop-before::before { top: -1px; } .drop-after::after { bottom: -1px; }
.row.drop-in { box-shadow: inset 0 0 0 2px var(--acc); }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 99; pointer-events: none; background: var(--acc); color: var(--acc-ink); padding: 5px 12px; border-radius: 99px; font-weight: 600; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; box-shadow: var(--shadow); }
.dragging, .dragging * { cursor: grabbing !important; user-select: none !important; }
.b-foot { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
.sync { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--mut); font-size: 12px; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.sync.busy i { background: var(--acc); animation: pulse 1s infinite; }
.sync.perm i, .sync.err i { background: var(--warn); }
.sync.perm, .sync.err { color: var(--warn); font-weight: 600; }
.sync.off { text-decoration: underline dotted; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- top and status bars ---------- */
.top { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); min-height: 48px; }
.crumbs { display: flex; align-items: baseline; gap: 4px; min-width: 0; overflow: hidden; white-space: nowrap; }
.crumb { color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
.crumb:not(.cur)::after { content: '/'; margin-left: 5px; color: var(--line); }
.crumb.cur { border: 0; background: none; padding: 2px 4px; border-radius: 4px; font: 600 15px var(--serif); color: var(--ink); cursor: pointer; }
.status { display: flex; align-items: center; gap: 18px; padding: 0 14px; min-height: 30px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--mut); white-space: nowrap; overflow: hidden; }
.st b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.st.goal { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer; padding: 3px 6px; border-radius: 6px; color: var(--mut); }
.st.goal .blot { color: var(--acc); }
.unfocus { position: absolute; top: 10px; right: 12px; border: 0; background: none; color: var(--faint); opacity: .5; cursor: pointer; padding: 8px; border-radius: 50%; display: grid; z-index: 5; }
.unfocus:hover { opacity: 1; background: var(--field); }
.app.focus .top, .app.focus .status, .app.focus .fmt { display: none; }

/* ---------- editor ---------- */
.ed-pane { flex: 1 1 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.ed-pane.hide { display: none; }
.fmt { display: flex; align-items: center; gap: 2px; padding: 4px 10px; border-bottom: 1px solid var(--line); min-height: 42px; overflow-x: auto; }
.fmt .sep, .mk-tools .sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; flex: none; }
.ed-host { flex: 1; min-height: 0; }
.ed-host .cm-editor { height: 100%; background: transparent; color: var(--ink); }
.ed-host .cm-editor.cm-focused { outline: none; }
.ed-host .cm-scroller { overflow: auto; font-family: var(--ed-font); font-size: var(--ed-size); line-height: var(--ed-lh); overscroll-behavior: contain; }
.ed-host .cm-content { max-width: calc(var(--ed-width) + 56px); margin: 0 auto; padding: 44px 28px 46vh; caret-color: var(--acc); font-variant-ligatures: common-ligatures; }
.ed-host .cm-line { padding: 0; }
.ed-host .cm-activeLine { background: transparent; }
.ed-host .cm-placeholder { color: var(--faint); font-style: italic; }
.ed-pane.dim .cm-focused .cm-line:not(.cm-activeLine) { opacity: .32; transition: opacity .2s; }
.cm-b { font-weight: 700; } .cm-i { font-style: italic; }
.cm-hl { background: var(--hl); border-radius: 2px; padding: .12em 0; }
.cm-mk { color: var(--faint); }
.cm-note, .r-note { display: inline-block; vertical-align: baseline; min-width: 1.05em; height: 1.05em; margin: 0 .15em; padding: 0 .4em; border-radius: 99px 99px 99px 3px; background: var(--note); color: var(--note-ink); font: 650 .58em/1.75 var(--sans); cursor: pointer; text-align: center; position: relative; top: -.06em; }
.cm-note.empty { background: none; box-shadow: inset 0 0 0 1.5px var(--note); }
.cm-h { font-weight: 650; line-height: 1.3; font-family: var(--serif); }
.cm-h1 { font-size: 1.55em; } .cm-h2 { font-size: 1.28em; } .cm-h3 { font-size: 1.1em; }
.ed-host .cm-line.cm-quote { border-left: 3px solid var(--acc); padding-left: 16px; color: var(--mut); }
.ed-host .cm-line.cm-break { text-align: center; color: var(--faint); letter-spacing: .35em; }
.lens-filter { box-shadow: inset 0 -2px 0 #d99a00; }
.lens-adverb { box-shadow: inset 0 -2px 0 #9a63e0; }
.lens-repeat { background: color-mix(in srgb, #19a6a0 26%, transparent); border-radius: 2px; }
.lens-long { text-decoration: underline dotted var(--mut); text-underline-offset: 4px; }
.lens-mech { background: color-mix(in srgb, var(--err) 30%, transparent); border-radius: 2px; }
.lens-dialogue { color: color-mix(in srgb, var(--acc) 78%, var(--ink)); }
.gram { text-decoration: underline wavy var(--acc); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.gram-spell { text-decoration-color: var(--err); }
.gram-style { text-decoration-color: var(--warn); }
.ed-host .cm-panels { background: var(--side); color: var(--ink); border-color: var(--line); font: 13px var(--sans); }
.ed-host .cm-panels-top { border-bottom: 1px solid var(--line); }
.ed-host .cm-search { padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ed-host .cm-search br { display: none; }
.ed-host .cm-search label { display: inline-flex; align-items: center; gap: 4px; color: var(--mut); }
.ed-host .cm-textfield { border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); padding: 5px 8px; font: inherit; }
.ed-host .cm-button { border: 0; border-radius: 6px; background: var(--field); background-image: none; color: var(--ink); padding: 5px 10px; font: inherit; cursor: pointer; }
.ed-host .cm-search [name=close] { font-size: 20px; color: var(--mut); cursor: pointer; background: none; border: 0; }
.cm-searchMatch { background: color-mix(in srgb, var(--acc) 22%, transparent); }
.cm-searchMatch-selected { background: color-mix(in srgb, var(--acc) 48%, transparent); }
.plain-editor { width: 100%; height: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font: var(--ed-size)/var(--ed-lh) var(--ed-font); padding: 44px max(28px, calc((100% - var(--ed-width)) / 2)) 40vh; }

.note-pop { position: fixed; z-index: 61; width: min(340px, calc(100vw - 20px)); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.note-pop textarea { border: 0; outline: 0; resize: none; background: var(--field); border-radius: var(--r); padding: 8px 10px; line-height: 1.45; }
.np-foot { display: flex; align-items: center; gap: 8px; }

/* ---------- markup (ink) ---------- */
.mk { flex: 1 1 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.stage.v-split .mk { border-right: 1px solid var(--line); }
.mk-tools { display: flex; align-items: center; gap: 4px; padding: 4px 10px; min-height: 42px; border-bottom: 1px solid var(--line); background: var(--paper); }
.mk-tool { width: 32px; height: 32px; border: 0; background: none; border-radius: var(--r); display: grid; place-items: center; cursor: pointer; color: var(--mut); }
.mk-tool i { width: 16px; height: 16px; border-radius: 50%; display: block; }
.mk-tool.on { background: var(--acc-soft); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--acc); }
.mk-scroll { flex: 1; overflow: auto; padding: 14px 6px 40vh; touch-action: pan-y pinch-zoom; overscroll-behavior: contain; }
.mk-scroll.finger { touch-action: none; }
.mk-fit { margin: 0 auto; position: relative; }
.mk-page { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--paper); color: var(--ink); padding: 48px 200px 90px 48px; font: 18px/2.15 var(--serif); border-radius: 3px; box-shadow: 0 0 0 1px var(--line); user-select: none; -webkit-user-select: none; background-image: linear-gradient(var(--line), var(--line)); background-size: 1px 100%; background-repeat: no-repeat; background-position: 614px 0; }
.mk-p { position: relative; margin: 0 -200px .7em -48px; padding: 0 200px 0 48px; }
.mk-p.t-h .mk-text { font-weight: 650; font-size: 1.25em; }
.mk-p.t-quote .mk-text { border-left: 3px solid var(--acc); padding-left: 14px; color: var(--mut); }
.mk-p.t-break .mk-text { text-align: center; color: var(--faint); }
.mk-text mark { background: var(--hl); color: inherit; border-radius: 2px; }
.mk-ink { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.mk-done { position: absolute; right: 8px; top: 6px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); color: var(--ok); display: grid; place-items: center; cursor: pointer; }
.stage.v-split .mk-p:hover .mk-text { background: color-mix(in srgb, var(--acc) 6%, transparent); }

/* ---------- corkboard ---------- */
.cork { flex: 1; overflow: auto; padding: 30px clamp(16px, 4vw, 48px) 90px; background: var(--bg); }
.cork-head { margin-bottom: 22px; }
.cork-head h1 { font: 600 28px/1.2 var(--serif); letter-spacing: -.01em; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 18px; }
.card { background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--lab, var(--line)); border-radius: 4px; display: flex; flex-direction: column; min-height: 176px; position: relative; }
.card header { display: flex; align-items: baseline; gap: 8px; padding: 9px 12px 7px; border-bottom: 1px solid color-mix(in srgb, var(--err) 40%, var(--line)); cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
.card header b { flex: 1; font: 600 15.5px/1.3 var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-num { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.c-syn { flex: 1; border: 0; outline: 0; resize: none; background: repeating-linear-gradient(transparent 0 23px, color-mix(in srgb, var(--line) 70%, transparent) 23px 24px); line-height: 24px; padding: 0 12px; min-height: 96px; }
.card footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 12px 8px; font-size: 12px; color: var(--mut); }
.card.add { border: 1.5px dashed var(--line); background: none; align-items: center; justify-content: center; gap: 8px; color: var(--mut); cursor: pointer; }
.card.add:hover { color: var(--ink); border-color: var(--mut); }
.card.drop-before { box-shadow: -5px 0 0 -1px var(--acc); } .card.drop-after { box-shadow: 5px 0 0 -1px var(--acc); }
.list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
.l-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r); background: var(--field); }
.l-row.cur { box-shadow: inset 0 0 0 1.5px var(--acc); }
.l-row .blot { color: var(--acc); }

/* ---------- inspector ---------- */
.insp > .seg { margin: 10px; justify-content: space-between; }
.insp > .seg button { flex: 1; justify-content: center; padding: 4px; }
.i-body { flex: 1; overflow-y: auto; padding: 4px 14px 30px; display: flex; flex-direction: column; }
.form.grow { flex: 1; }
.form.grow .fld { flex: 1; }
.field.tall { flex: 1; min-height: 150px; }
.m-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.marks .tags, .check .tags { margin-bottom: 10px; }
.mark, .gram-item { display: flex; align-items: flex-start; gap: 4px; border-top: 1px solid var(--line); padding: 6px 0; }
.gram-item { flex-direction: column; }
.m-main { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 4px; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; line-height: 1.4; }
.m-main:hover { background: var(--field); }
.m-main mark { background: var(--hl); color: inherit; border-radius: 2px; padding: 0 2px; font-family: var(--serif); align-self: flex-start; }
.m-main span { color: var(--mut); }
.reps { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 4px 2px; }
.lens-list { display: flex; flex-direction: column; gap: 9px; margin: 12px 0 0 2px; }
.lens-row { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
.lens-row input { accent-color: var(--acc); margin-top: 3px; }
.lens-row span { flex: 1; } .lens-row small { display: block; color: var(--mut); font-size: 12px; }
.lens-row b { font-variant-numeric: tabular-nums; }
.sw { width: 16px; height: 12px; margin-top: 4px; flex: none; display: inline-block; }
.sw.lens-long { border-bottom: 2px dotted var(--mut); } .sw.lens-dialogue { background: color-mix(in srgb, var(--acc) 60%, transparent); border-radius: 2px; }
.hist { display: flex; flex-direction: column; gap: 6px; }
.snap { display: flex; flex-direction: column; text-align: left; border: 0; background: var(--field); border-radius: var(--r); padding: 7px 10px; cursor: pointer; }
.snap span { color: var(--mut); font-size: 12.5px; }
.snap-text { white-space: pre-wrap; font: 16px/1.7 var(--serif); max-width: 40em; margin: 0 auto; }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 22, .45); display: grid; place-items: center; padding: 16px; }
.overlay.top { z-index: 70; align-items: start; padding-top: 12vh; }
.dialog { background: var(--paper); border-radius: 14px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: min(92dvh, 900px); display: flex; flex-direction: column; overflow: hidden; }
.dialog.wide { width: min(900px, 100%); }
.dialog.small { width: min(420px, 100%); }
.dialog.small h2 { margin-bottom: 8px; }
.dialog.small .field { margin-top: 10px; }
.d-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 10px 22px; }
.d-body { padding: 4px 22px 22px; overflow-y: auto; }
.dialog.small .d-body { padding-top: 22px; }
.d-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--line); }
.menu-catch { position: fixed; inset: 0; z-index: 60; }
.menu { position: fixed; min-width: 190px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; display: flex; flex-direction: column; }
.menu button { display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; min-height: 36px; }
.menu button:hover { background: var(--field); }
.menu button.danger { color: var(--err); }
.menu hr { margin: 4px 0; }
.toasts { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(520px, calc(100vw - 24px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--paper); padding: 9px 8px 9px 16px; border-radius: 10px; box-shadow: var(--shadow); max-width: 100%; }
.toast .btn-ico { color: inherit; opacity: .7; }
.toast .btn.link { color: inherit; text-decoration: underline; }
.toast.err { background: var(--err); color: #fff; } .toast.warn { background: var(--warn); color: #fff; }
.palette { width: min(620px, 100%); background: var(--paper); border-radius: 14px; box-shadow: var(--shadow); padding: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 70dvh; }
.palette .field { font-size: 16px; padding: 10px 12px; }
.p-list { overflow-y: auto; display: flex; flex-direction: column; }
.p-list button { display: flex; flex-direction: column; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
.p-list button.on, .p-list button:hover { background: var(--acc-soft); }
.p-list span { color: var(--mut); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- dialog content ---------- */
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 22px; margin: 6px 0 20px; }
.figs div { display: flex; flex-direction: column; gap: 2px; }
.figs b { font: 600 30px/1.15 var(--serif); font-variant-numeric: tabular-nums; }
.figs b.with-blot { display: flex; align-items: center; gap: 8px; }
.figs .blot { color: var(--acc); }
.figs span { color: var(--mut); font-size: 12.5px; }
.chart { margin: 0 0 14px; }
.chart figcaption { font-weight: 650; margin-bottom: 4px; }
.chart-box { position: relative; }
.chart svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .goal { stroke: var(--mut); stroke-width: 1; stroke-dasharray: 3 4; }
.chart .tick { fill: var(--mut); font: 11px var(--sans); }
.tip { position: absolute; top: -6px; transform: translate(-50%, -100%); background: var(--ink); color: var(--paper); border-radius: 8px; padding: 5px 10px; display: flex; flex-direction: column; white-space: nowrap; pointer-events: none; font-size: 12.5px; z-index: 2; }
.tip span { opacity: .75; }
.pass { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; }
.pass .bar { grid-column: 1 / -1; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 12.5px; color: var(--mut); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl.rel { margin-top: 18px; }
.tbl.rel tr.ready td:first-child { box-shadow: inset 3px 0 0 var(--ok); }
.cell { display: flex; align-items: center; gap: 8px; }
.cell .field { width: 146px; padding: 4px 8px; min-height: 30px; }
.dow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
.picklist { display: flex; flex-direction: column; gap: 8px; max-height: 46dvh; overflow-y: auto; padding-right: 6px; }
.themes { display: flex; flex-wrap: wrap; gap: 8px; }
.theme { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: none; border-radius: var(--r); padding: 6px 12px 6px 7px; cursor: pointer; }
.theme.on { box-shadow: inset 0 0 0 1.5px var(--acc); border-color: transparent; }
.theme i { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line); }
.t-paper i { background: #fbfcfe; } .t-sepia i { background: #f4ebd7; } .t-ink i { background: #0f1727; } .t-black i { background: #000; }
.t-auto i { background: linear-gradient(135deg, #fbfcfe 50%, #0f1727 50%); }
.list-ed { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.list-ed div { display: flex; gap: 6px; align-items: center; width: 100%; }
.list-ed input[type=color] { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; flex: none; }
input[type=range] { width: 100%; accent-color: var(--acc); }

/* ---------- small screens: side panels slide over the page ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .binder, .insp { position: fixed; top: 0; bottom: 0; z-index: 40; width: min(330px, 88vw); visibility: visible !important; transition: transform .18s ease-out; box-shadow: var(--shadow); }
  .binder { left: 0; transform: translateX(-106%); } .insp { right: 0; transform: translateX(106%); }
  .app:not(.no-binder):not(.focus) .binder, .app:not(.no-insp):not(.focus) .insp { transform: none; }
  .app:not(.no-binder) .scrim, .app:not(.no-insp) .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(8, 12, 22, .4); }
  .stage.v-split { flex-direction: column; }
  .stage.v-split .mk { border-right: 0; border-bottom: 1px solid var(--line); }
  .cols, .row2, .row3 { grid-template-columns: 1fr; }
  .status { gap: 12px; }
  .top .seg button span { font-size: 13px; }
}
@media (pointer: coarse) {
  .row { height: 42px; }
  .btn, .seg button { min-height: 38px; }
  .btn-ico { min-width: 40px; }
  .seg button { padding: 4px 12px; }
  .mk-tool { width: 40px; height: 40px; }
  .tw { width: 26px; height: 36px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { .binder, .insp, .top, .status, .fmt { display: none !important; } }

/* ---------- outline, wiki, read-through, compare ---------- */
.b-tools { flex-wrap: wrap; justify-content: flex-start; gap: 2px; }
.r-part { width: 4px; height: 18px; border-radius: 2px; flex: none; }
.c-part { display: inline-flex; align-items: center; gap: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-part i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.dialog.full { width: min(1500px, 100%); height: min(92dvh, 1000px); }
.dialog.full .d-body { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.empty { max-width: 46em; }
.shape { display: flex; gap: 2px; height: 34px; border-radius: 6px; overflow: hidden; margin-bottom: 14px; flex: none; }
.shape div { min-width: 6px; display: flex; align-items: center; overflow: hidden; }
.shape span { padding: 0 8px; font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; text-shadow: 0 0 3px rgba(0, 0, 0, .55); }
.ol-board { display: flex; gap: 12px; overflow-x: auto; flex: 1; min-height: 0; padding-bottom: 8px; align-items: stretch; }
.ol-col { flex: 0 0 258px; display: flex; flex-direction: column; gap: 8px; background: var(--field); border-radius: 10px; padding: 10px; border-top: 4px solid var(--pc, var(--line)); overflow-y: auto; }
.ol-col.drop-in { box-shadow: inset 0 0 0 2px var(--acc); }
.ol-col header { display: flex; align-items: center; gap: 2px; min-height: 32px; }
.ol-col header input[type=color] { width: 22px; height: 22px; padding: 0; border: 0; background: none; flex: none; }
.ol-title { flex: 1; min-width: 0; border: 0; background: none; font: 600 15px var(--serif); padding: 4px; border-radius: 4px; }
.ol-col header .btn-ico { min-width: 26px; padding: 3px; min-height: 26px; }
.ol-note { border: 0; background: var(--paper); border-radius: 6px; padding: 7px 9px; resize: vertical; line-height: 1.4; font-size: 13px; }
.ol-items { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 60px; }
.ol-chip { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--pc, var(--line)); border-radius: 6px; padding: 7px 9px; cursor: pointer; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
.ol-chip span, .ol-chip small { color: var(--mut); font-size: 12px; }
.ol-chip.scene { border-style: dashed; }
.drop-hint { text-align: center; padding: 14px 0; border: 1.5px dashed var(--line); border-radius: 6px; }
.ol-add { flex: 0 0 150px; border: 1.5px dashed var(--line); background: none; border-radius: 10px; color: var(--mut); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.wiki-add { display: grid; grid-template-columns: 1.3fr .8fr 1.4fr auto; gap: 8px; margin-bottom: 10px; }
.insp .wiki-add { grid-template-columns: 1fr; }
.wiki-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 6px; }
.wiki-bar .field { width: 220px; }
.wiki-tab { display: flex; flex-direction: column; gap: 6px; }
.we { border-top: 1px solid var(--line); padding: 4px 0; }
.we-body { padding: 4px 4px 8px; font-size: 13px; white-space: pre-wrap; }
.ap { display: flex; flex-direction: column; margin-bottom: 8px; }
.ap b, .ap button { display: flex; justify-content: space-between; gap: 8px; padding: 4px 6px; }
.ap button { border: 0; background: none; text-align: left; cursor: pointer; border-radius: 5px; padding-left: 16px; color: var(--mut); }
.ap button:hover { background: var(--field); color: var(--ink); }
.ap span { font-variant-numeric: tabular-nums; color: var(--faint); }
.lens-wiki { text-decoration: underline dotted color-mix(in srgb, var(--acc) 70%, transparent); text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
.read { flex: 1; overflow: auto; background: var(--paper); }
.rd-col { max-width: calc(var(--ed-width) + 56px); margin: 0 auto; padding: 36px 28px 30vh; font: var(--ed-size)/var(--ed-lh) var(--ed-font); }
.rd-col h1 { font: 600 30px/1.2 var(--serif); }
.rd-col h2 { font: 600 22px/1.3 var(--serif); margin: 2em 0 .4em; }
.rd-col > .muted { font: 14px var(--sans); margin-bottom: 2em; }
.rd-scene { display: flex; justify-content: space-between; gap: 12px; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; padding: 8px 0; margin: 2.2em 0 1em; font: 600 13px var(--sans); color: var(--mut); cursor: pointer; text-align: left; }
.rd-scene span { font-weight: 400; color: var(--faint); }
.rd-col p, .rd-col blockquote, .rd-col h3 { margin: 0 0 1em; cursor: pointer; border-radius: 4px; }
.rd-col p:hover, .rd-col blockquote:hover { background: color-mix(in srgb, var(--acc) 6%, transparent); }
.rd-col blockquote { border-left: 3px solid var(--acc); padding-left: 16px; color: var(--mut); }
.rd-col mark { background: var(--hl); color: inherit; border-radius: 2px; }
.rd-break { text-align: center; color: var(--faint); letter-spacing: .35em; }
.diff ins { background: color-mix(in srgb, var(--ok) 26%, transparent); text-decoration: none; border-radius: 2px; }
.diff del { background: color-mix(in srgb, var(--err) 22%, transparent); color: var(--mut); border-radius: 2px; }
.d-foot .chk { margin-right: auto; }
@media (max-width: 900px) { .wiki-add { grid-template-columns: 1fr; } }
</style>
